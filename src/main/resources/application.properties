server.port=8080
spring.application.name=weather-application


# --- Database ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:weather_app}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# --- External weather API (OpenWeatherMap free tier) ---
app.weather.api-key=${WEATHER_API_KEY:}
app.weather.base-url=https://api.openweathermap.org/data/2.5

# --- JWT ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# --- CORS ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}


